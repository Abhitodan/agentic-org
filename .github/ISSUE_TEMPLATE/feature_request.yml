name: Feature / skill idea
description: Propose a skill, persona improvement, or control-plane feature.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What breaks or is awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Prefer executable skills (script + eval) over prompt-only packs.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skills
        - Personas
        - Orchestration / Mode A
        - Command Center
        - Docs / demos
        - Other
