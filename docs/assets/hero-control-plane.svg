<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">agentic-org Mode A control plane</title>
  <desc id="desc">Humans approve. Agents execute. Everything leaves a trail. Flow from agentctl to runner to git and audit chain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101418"/>
      <stop offset="55%" stop-color="#152029"/>
      <stop offset="100%" stop-color="#1a2a24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e2a33"/>
      <stop offset="45%" stop-color="#243b2e"/>
      <stop offset="100%" stop-color="#1e2a33"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="180" fill="#8fd3ff" opacity="0.05"/>
  <circle cx="180" cy="520" r="220" fill="#7dd3a7" opacity="0.06"/>

  <text x="72" y="88" fill="#8fd3ff" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="20" letter-spacing="4">MODE A CONTROL PLANE</text>
  <text x="72" y="150" fill="#f2f5f7" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="44" font-weight="700">Humans approve. Agents execute.</text>
  <text x="72" y="204" fill="#f2f5f7" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="44" font-weight="700">Everything leaves a trail.</text>
  <text x="72" y="250" fill="#a9b7c4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="20">Local-first · budgeted · reversible · fail-closed</text>

  <!-- flow cards -->
  <g filter="url(#soft)">
    <rect x="72" y="300" width="340" height="110" rx="16" fill="#1b242c" stroke="#2d3a46"/>
    <rect x="470" y="300" width="340" height="110" rx="16" fill="#1b242c" stroke="#2d3a46"/>
    <rect x="868" y="300" width="340" height="110" rx="16" fill="#1b242c" stroke="#2d3a46"/>
  </g>
  <text x="242" y="350" text-anchor="middle" fill="#e8eef7" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="24" font-weight="600">agentctl / UI</text>
  <text x="242" y="382" text-anchor="middle" fill="#8aa0b3" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">command center · gates</text>

  <text x="640" y="350" text-anchor="middle" fill="#e8eef7" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="24" font-weight="600">Mode A runner</text>
  <text x="640" y="382" text-anchor="middle" fill="#8aa0b3" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">brain · plan · implement</text>

  <text x="1038" y="350" text-anchor="middle" fill="#e8eef7" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="24" font-weight="600">git + audit chain</text>
  <text x="1038" y="382" text-anchor="middle" fill="#8aa0b3" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16">checkpoints · verify</text>

  <path d="M422 355 H458" stroke="#6f8394" stroke-width="3" stroke-linecap="round"/>
  <path d="M448 345 L460 355 L448 365" fill="none" stroke="#6f8394" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M820 355 H856" stroke="#6f8394" stroke-width="3" stroke-linecap="round"/>
  <path d="M846 345 L858 355 L846 365" fill="none" stroke="#6f8394" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dashboard strip -->
  <rect x="72" y="450" width="1136" height="120" rx="18" fill="url(#panel)" stroke="#2d3a46"/>
  <text x="100" y="500" fill="#a9c0b0" font-family="IBM Plex Mono, Consolas, monospace" font-size="18">Command Center</text>
  <text x="100" y="534" fill="#7f9a8d" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="18">budgets · human gates · hash-chained events · loopback by default</text>

  <rect x="820" y="478" width="120" height="64" rx="12" fill="#15241c" stroke="#3d5a48"/>
  <text x="880" y="516" text-anchor="middle" fill="#7dd3a7" font-family="IBM Plex Mono, Consolas, monospace" font-size="16">BUDGET</text>
  <rect x="956" y="478" width="120" height="64" rx="12" fill="#152029" stroke="#3a4d5c"/>
  <text x="1016" y="516" text-anchor="middle" fill="#8fd3ff" font-family="IBM Plex Mono, Consolas, monospace" font-size="16">GATES</text>
  <rect x="1092" y="478" width="90" height="64" rx="12" fill="#241c15" stroke="#5a4a34"/>
  <text x="1137" y="516" text-anchor="middle" fill="#f0b429" font-family="IBM Plex Mono, Consolas, monospace" font-size="16">AUDIT</text>
</svg>
